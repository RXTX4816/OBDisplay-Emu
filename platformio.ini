; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; A plain `pio run` builds the firmware only; tests use -e native / -e mega_sim.
default_envs = ATmega2560

[env]
extra_scripts = pre:tools/inject_version.py

[env:ATmega2560]
platform = atmelavr
board = megaatmega2560
monitor_speed = 115200
framework = arduino

; Unit tests for the simulation, the group readings and the ECU table, on the
; host. -fpermissive matches the Arduino AVR core: some ECU ID strings fill
; their arrays exactly, without a terminating zero (only 12 characters of each
; are ever sent).
; Run with: pio test -e native
[env:native]
platform = native
build_flags =
  -Wall
  -Wextra
  -fpermissive
  -Inative_arduino
test_build_src = yes
build_src_filter =
  +<ecu.cpp>
  +<sim.cpp>
  +<groups.cpp>

; Same tests on a simulated ATmega2560 (simavr), built like the firmware:
; avr-libc float math, 16-bit int and real PROGMEM access.
; Run with: pio test -e mega_sim
[env:mega_sim]
platform = atmelavr
board = megaatmega2560
framework = arduino
platform_packages = platformio/tool-simavr
test_build_src = yes
build_src_filter =
  +<*>
  -<main.cpp>
; Nothing to flash: the ELF goes straight into the simulator.
upload_protocol = custom
upload_command = true
test_speed = 115200
; A hung firmware never reaches the end of the run, so the timeout turns it into
; a failed suite instead of a stuck CI job.
test_testing_command =
  timeout
  180
  ${platformio.packages_dir}/tool-simavr/bin/simavr
  -m
  atmega2560
  -f
  16000000L
  ${platformio.build_dir}/${this.__env__}/firmware.elf
